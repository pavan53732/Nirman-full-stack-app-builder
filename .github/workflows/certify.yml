name: certify

# Correction 5 of the Step 3 review: the contract-graph verifier must run
# automatically on every documentation commit, not only when invoked by hand.
#
# This is the documentation tier of the promotion pipeline described in the
# review. Later tiers (schema parity, runtime unit tests, fault injection,
# Android end-to-end fixture) are added as the runtime is implemented; each is a
# separate job so a failure names the tier that failed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-graph:
    name: Contract graph certification (BS §67.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The verifier exits non-zero on any defect, so it gates the commit by
      # itself. No extra assertion step is needed.
      - name: Certify the contract graph
        run: python3 tools/verify_contract_graph.py .

      # A verifier that has never failed is vacuous evidence. The battery
      # injects one defect per check into throwaway copies and requires the
      # verifier to reject each, so this job proves the gate above can fail.
      - name: Prove every check is non-vacuous
        run: python3 tools/test_verify_contract_graph.py

      # Determinism is a requirement of the specification's own evidence rules
      # (§57 forbids non-deterministic evidence), so it is asserted rather than
      # assumed.
      - name: Assert deterministic output
        run: |
          python3 tools/verify_contract_graph.py . > /tmp/run1.txt
          python3 tools/verify_contract_graph.py . > /tmp/run2.txt
          diff /tmp/run1.txt /tmp/run2.txt || {
            echo "::error::verifier output is not deterministic"
            exit 1
          }
