[package]
name = "nirman-control-plane"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nirman-domain = { path = "../nirman-domain" }
nirman-storage = { path = "../nirman-storage" }
nirman-supervisor = { path = "../nirman-supervisor" }
rusqlite = { version = "0.29", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
nirman-ipc = { path = "../nirman-ipc" }
