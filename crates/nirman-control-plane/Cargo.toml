[package]
name = "nirman-control-plane"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nirman-android = { path = "../nirman-android" }
nirman-artifacts = { path = "../nirman-artifacts" }
nirman-domain = { path = "../nirman-domain" }
nirman-policy = { path = "../nirman-policy" }
nirman-skills = { path = "../nirman-skills" }
nirman-storage = { path = "../nirman-storage" }
nirman-tools = { path = "../nirman-tools" }
nirman-supervisor = { path = "../nirman-supervisor" }
nirman-workers = { path = "../nirman-workers" }
rusqlite = { version = "0.29", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
nirman-ipc = { path = "../nirman-ipc" }
nirman-project = { path = "../nirman-project" }
